<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SayHi component importer vNext</title>
    <script type="module" src="/src/ui.ts"></script>
  </head>
  <body>
    <main class="importer-shell">
      <div class="eyebrow">DTCG 2025.10 · Verify fixture</div>
      <h1>SayHi component importer</h1>
      <p class="intro">
        Materialize canonical tokens, themes, anatomy, and motion into an
        editable Penpot component.
      </p>
      <dl class="coverage" aria-label="Import coverage">
        <div>
          <dt>Token sets</dt>
          <dd id="set-count">4</dd>
        </div>
        <div>
          <dt>Themes</dt>
          <dd id="theme-count">2</dd>
        </div>
        <div>
          <dt>Bindings</dt>
          <dd id="binding-count">0</dd>
        </div>
      </dl>
      <button id="import" type="button">Import or update SayHi Verify</button>
      <button id="export" class="quiet" type="button">
        Export DTCG resolver
      </button>
      <p id="status" class="status" role="status" aria-live="polite">
        The existing SVG importer remains unchanged.
      </p>
      <button id="close" class="quiet close" type="button">Close</button>
    </main>
  </body>
</html>
